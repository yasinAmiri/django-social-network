{% extends 'base.html' %}

{% block content %}
    <form action="" method="get" class="mb-3">
        {{ form }}
        <input type="submit" value="Search">
    </form>

    <div class="card">
        {% for post in posts %}
            <a href="{{ post.get_absolute_url }}" class="card-body d-flex gap-3 align-items-start" style="text-decoration:none;">
                {% if post.user.profile.avatar %}
                    <img src="{{ post.user.profile.avatar.url }}" style="width:44px; height:44px; border-radius:50%; object-fit:cover;" alt="avatar">
                {% endif %}
                <div>
                    <strong>{{ post.user.username }}</strong>
                    <span style="color:#888;">· {{ post.updated|timesince }} ago</span>
                    <p style="margin:6px 0 0 0; color:#e2e8f0;">{{ post.body|truncatewords:20 }}</p>
                    {% if post.image %}
                        <img src="{{ post.image.url }}" style="max-width: 400px; width: 100%; border-radius: 8px; margin-top: 8px;" alt="post image">
                    {% endif %}
                </div>
            </a>
            <hr style="margin:0;">
        {% endfor %}
    </div>
{% endblock %}
